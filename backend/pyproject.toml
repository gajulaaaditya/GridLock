[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gridlock"
version = "0.1.0"
description = "Evidence-backed utility coordination analysis"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "pypdf>=6.19.0",
  "PyYAML>=6.0,<7",
]

[project.scripts]
gridlock = "gridlock.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/gridlock"]
